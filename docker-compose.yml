services:
  plant-care:
    build: .
    ports:
      - "8000:8080"
    environment:
      DEVICE_API_KEY: ${DEVICE_API_KEY:-demo-device-key}
      DATABASE_PATH: /data/plant_care.db
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - plant-data:/data
volumes:
  plant-data:
